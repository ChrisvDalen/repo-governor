plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
}

subprojects {
    group = 'io.repogovernor'
    version = '0.1.0'

    plugins.withId('java') {
        java {
            // Target prompt is Java 25; this build targets 21 because that is the
            // newest LTS available in the development environment. Bump the
            // toolchain when JDK 25 is installed.
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        repositories {
            mavenCentral()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}
