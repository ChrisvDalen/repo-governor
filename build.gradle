plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
}

subprojects {
    group = 'io.repogovernor'
    version = '0.1.0'

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        repositories {
            mavenCentral()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}
