services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repogovernor
      POSTGRES_USER: repogovernor
      POSTGRES_PASSWORD: repogovernor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repogovernor"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: repo-governor-server/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repogovernor
      DB_USERNAME: repogovernor
      DB_PASSWORD: repogovernor
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: repo-governor-web
    ports:
      - "8081:80"
    depends_on:
      - server

volumes:
  postgres-data:
