spring:
  application:
    name: repo-governor-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repogovernor}
    username: ${DB_USERNAME:repogovernor}
    password: ${DB_PASSWORD:repogovernor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

repo-governor:
  seed:
    # Seeds a 'demo-org' organization with API key 'dev-api-key' on startup.
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
